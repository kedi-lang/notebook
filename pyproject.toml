[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "kedi-notebook"
version = "0.1.0"
description = "Local interactive notebook for the Kedi Programming Language"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "basedpyright>=1.40.2,<1.41",
    "fastapi>=0.162.0,<0.163",
    "kedi>=0.1.1,<0.2",
    "python-dotenv>=1.2.4,<2",
    "uvicorn>=0.54,<0.55",
]

[project.urls]
Source = "https://github.com/kedi-lang/notebook"
Tracker = "https://github.com/kedi-lang/notebook/issues"

[project.scripts]
kedi-notebook = "kedi_notebook.server:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "playwright==1.64.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[tool.hatch.build]
include = [
    "src/kedi_notebook/**/*.py",
    "src/kedi_notebook/static/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kedi_notebook"]

[tool.uv.sources]
kedi = { path = "..", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["kedi_notebook"]

[tool.coverage.report]
show_missing = true
