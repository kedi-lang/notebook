[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kedi-notebook"
version = "0.1.0"
description = "Local interactive notebook for the Kedi Programming Language"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "basedpyright>=1.39.6",
    "fastapi>=0.138.1",
    "kedi>=0.4.0",
    "uvicorn>=0.30",
]

[project.urls]
Source = "https://github.com/kedi-lang/notebook"
Tracker = "https://github.com/kedi-lang/notebook/issues"

[project.scripts]
kedi-notebook = "kedi_notebook.server:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-cov>=5",
    "ruff>=0.15",
]

[tool.hatch.build]
include = [
    "src/kedi_notebook/**/*.py",
    "src/kedi_notebook/static/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kedi_notebook"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["kedi_notebook"]

[tool.coverage.report]
show_missing = true
